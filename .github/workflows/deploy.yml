name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Never deploy a red build.
      - run: npm run typecheck
      # Web v1: web/dist is uploaded as Workers static assets by `wrangler deploy` ([assets] in wrangler.toml).
      # Built before the tests so QA's bundle checks run too.
      - name: Build web
        run: npm run build:web
      - run: npm test
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply pumpevakt --remote
      - name: Deploy Worker
        run: npx wrangler deploy
