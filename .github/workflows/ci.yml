name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before testing so QA's bundle checks (test/qa/web-static.test.ts, QA-WEB-DIST-*) run in CI.
      - run: npm run build:web
      - run: npm test
